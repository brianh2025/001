<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ===== 預設工程清單 =====
const DEFAULT_PROJECTS = [
  "00.麥寮鄉十八棟排水(許厝寮段後安寮小段1627地號旁)復建工程等二件",
  "01.台西鄉有才寮大排旁堤岸復建工程",
  "02.二崙鄉新庄子大排台19線上游護岸治理工程",
  "03.口湖新港大排二抽水站新建治理工程",
  "04.雲29線三和大橋引道(南、北岸)防汛道路改善工程",
  "05.口湖鄉椬梧滯洪池碼頭設施改善工程",
  "06.麥寮鄉四十棟排水(豐興段992地號旁)復建工程",
  "07.口湖鄉湖口村下湖口養殖區下湖口一大排四中排(下游段)排水改善工程",
  "08.北港鎮懷仁街排水改善工程",
  "09.A1-041臺西鄉火燒牛稠大排支線(臺西海埔地二號水門旁)護岸復建工程",
  "10.Danas-F-06-02-05-二崙鄉二崙大排(八角亭段1018地號旁)右岸復建工程",
  "11.四湖鄉三條崙海水浴場(三條崙段658-6地號)堤岸復建工程",
  "12.Danas-F-06-02-05-四湖鄉三條崙海岸保護工復建工程",
  "13.二崙鄉新庄子大排(新庄子段新庄子小段869地號旁)左岸復建工程"
];

const STORAGE_PROJECTS = "rt_report_projects_v1";
const STORAGE_RECORDS = "rt_report_records_v1";
const REMOVE_PASSWORD = "0827"; // 移除預設工程密碼
const WEATHER_OPTIONS = ["晴", "多雲", "陰", "雨", "雷陣雨", "颱風"];
const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];

function rocWeekday(rocY, m, d) {
  const dt = new Date(parseInt(rocY) + 1911, parseInt(m) - 1, parseInt(d));
  if (isNaN(dt.getTime())) return "";
  return WEEK_CN[dt.getDay()];
}

// 格式化輸出天數，若為整數則不顯示小數點，否則保留一位小數
function formatDays(num) {
  if (isNaN(num)) return "";
  return Number(num.toFixed(1)).toString();
}

// 輔助檢查內容是否為空或填寫「無」
const isEmptyOrNo = (text) => {
  if (!text) return true;
  const clean = text.replace(/[\s\r\n、，。：:.,\-_ \d]/g, "").trim();
  return (
    clean === "" ||
    clean === "無" ||
    clean === "無事項" ||
    clean === "無工作" ||
    clean === "無重要記事" ||
    clean === "無施工取樣" ||
    clean === "無會驗" ||
    clean === "無取樣"
  );
};

function parseReport(text) {
  const result = {
    projectName: "",
    rocY: "",
    rocM: "",
    rocD: "",
    weekday: "",
    weatherAm: "",
    weatherPm: "",
    startY: "",
    startM: "",
    startD: "",
    contractDays: "",
    accumDays: "",
    remainDays: "",
    excludeDays: "",
    plannedPct: "",
    actualPct: "",
    workItems: "",
    sampling: "",
    important: "",
    matched: {},
    notes: []
  };
  if (!text) return result;
  const t = text.replace(/\r/g, "");
  let m;

  // 1. 工程名稱
  m = t.match(/工程名稱[：:\s]*([^\n]+)/);
  if (m) {
    result.projectName = m[1].trim();
    result.matched.projectName = true;
  }

  // 2. 報表日期（避免抓到開工日）
  m = t.match(/(?:^|\n)[^\n]*?日期[：:\s]*(\d{2,3})\s*[\/\-年]\s*(\d{1,2})\s*[\/\-月]\s*(\d{1,2})/);
  if (m) {
    result.rocY = m[1];
    result.rocM = m[2];
    result.rocD = m[3];
    result.weekday = rocWeekday(+m[1], +m[2], +m[3]);
    result.matched.date = true;
  }

  // 3. 天氣
  m = t.match(/上午\s*[\/：:\-－]\s*([\u4e00-\u9fa5]+)/);
  if (m) {
    result.weatherAm = m[1].trim();
    result.matched.weatherAm = true;
  } else {
    const mAlt = t.match(/天氣[：:\s]*上午[：:\s]*([\u4e00-\u9fa5]+)/);
    if (mAlt) {
      result.weatherAm = mAlt[1].trim();
      result.matched.weatherAm = true;
    }
  }

  m = t.match(/下午\s*[\/：:\-－]\s*([\u4e00-\u9fa5]+)/);
  if (m) {
    result.weatherPm = m[1].trim();
    result.matched.weatherPm = true;
  } else {
    const mAlt = t.match(/下午[：:\s]*([\u4e00-\u9fa5]+)/);
    if (mAlt && !t.match(/下午[：:\s]*([\u4e00-\u9fa5]+)/)?.[0].includes("日期")) {
      result.weatherPm = mAlt[1].trim();
      result.matched.weatherPm = true;
    }
  }

  // 4. 開工日期
  m = t.match(/開工日(?:期)?[：:\s]*(\d{2,3})\s*[\/\-年]\s*(\d{1,2})\s*[\/\-月]\s*(\d{1,2})/);
  if (m) {
    result.startY = m[1];
    result.startM = m[2];
    result.startD = m[3];
    result.matched.start = true;
  }

  // 5. 各種工期
  m = t.match(/契約工期[：:\s]*(\d+(\.\d+)?)/);
  if (m) {
    result.contractDays = m[1];
    result.matched.contractDays = true;
  }
  m = t.match(/累計工期[：:\s]*(\d+(\.\d+)?)/);
  if (m) {
    result.accumDays = m[1];
    result.matched.accumDays = true;
  }
  m = t.match(/剩餘工期[：:\s]*(\d+(\.\d+)?)/);
  if (m) {
    result.remainDays = m[1];
    result.matched.remainDays = true;
  }

  // 6. 不計工期
  m = t.match(/不計(?:工期|天數|日數)[^\d\n]*(\d+(\.\d+)?)/);
  if (m) {
    result.excludeDays = m[1];
    result.matched.excludeDays = true;
  } else {
    // 廠商以「核准展延 X 天」填報時，視為不計工期並採總工期延長模式
    m = t.match(/(?:核准展延|展延天數|展延工期)[^\d\n]*(\d+(\.\d+)?)/);
    if (m) {
      result.excludeDays = m[1];
      result.matched.excludeDays = true;
      result.extendMode = true;
    }
  }

  // 7. 進度
  m = t.match(/預定進度[：:\s]*([\d.]+)\s*%?/);
  if (m) {
    result.plannedPct = m[1];
    result.matched.planned = true;
  }
  m = t.match(/實際進度[：:\s]*([\d.]+)\s*%?/);
  if (m) {
    result.actualPct = m[1];
    result.matched.actual = true;
  }

  // 8. 本日工作項目
  m = t.match(/本日(?:工作|施工)項目[：:\s]*\n?([\s\S]*?)(?=\n\s*(?:七|八|施工取樣會驗|施工取樣|取樣會驗|重要記事|查驗項目|施工監造工作內容)[、，。:：\s]|$)/);
  if (m) {
    result.workItems = m[1].trim();
    result.matched.workItems = true;
  }

  // 9. 施工取樣
  m = t.match(/(?:施工取樣會驗|施工取樣|取樣會驗)[：:\s]*\n?([\s\S]*?)(?=\n\s*(?:八|九|重要記事|查驗項目)[、，。:：\s]|$)/);
  if (m) {
    result.sampling = m[1].trim();
  }

  // 10. 重要記事
  m = t.match(/重要記事[：:\s]*\n?([\s\S]*?)(?=\n\s*(?:九|十|查驗項目)[、，。:：\s]|$)/);
  if (m) {
    result.important = m[1].trim();
  }

  // 工期邏輯初檢
  if (result.contractDays && result.accumDays && result.remainDays) {
    const sum = parseFloat(result.accumDays) + parseFloat(result.remainDays);
    if (Math.abs(sum - parseFloat(result.contractDays)) > 0.01) {
      result.notes.push(`廠商填報數據檢算不一致：累計(${result.accumDays}) + 剩餘(${result.remainDays}) = ${formatDays(sum)}天，與契約工期(${result.contractDays}天)不合。`);
    }
  }
  return result;
}

function computeDays(startY, startM, startD, rocY, rocM, rocD, contractDays, excludeDays, mode) {
  const emptyRes = { accum: "", remain: "", effContract: "", rawDiff: "", expectedEnd: "", accumFormula: "", remainFormula: "" };
  if (!startY || !rocY || !contractDays) return emptyRes;

  const s = new Date(parseInt(startY) + 1911, parseInt(startM) - 1, parseInt(startD));
  const c = new Date(parseInt(rocY) + 1911, parseInt(rocM) - 1, parseInt(rocD));

  if (isNaN(s.getTime()) || isNaN(c.getTime())) return emptyRes;

  const rawDiff = Math.floor((c - s) / 86400000) + 1; // 包含開工當日
  const ex = parseFloat(excludeDays || 0);
  const cd = parseFloat(contractDays);

  let accum, remain, effContract, accumFormula, remainFormula;

  if (mode === "extend") {
    // 總工期延長模式：累計天數照常照算，契約工期延長
    accum = rawDiff > 0 ? rawDiff : 0;
    effContract = cd + ex;
    remain = effContract - accum;

    accumFormula = `開工至今天數(${rawDiff}天) = ${formatDays(accum)}天`;
    remainFormula = `[契約(${formatDays(cd)}) + 不計(${formatDays(ex)})] - 累計(${formatDays(accum)}) = ${formatDays(remain)}天`;
  } else {
    // 限期完工模式：契約不變，累計扣除不計天數
    accum = Math.max(rawDiff - ex, 0);
    effContract = cd;
    remain = cd - accum;

    accumFormula = `開工至今(${rawDiff}天) - 不計(${formatDays(ex)}天) = ${formatDays(accum)}天`;
    remainFormula = `契約(${formatDays(cd)}天) - 累計(${formatDays(accum)}天) = ${formatDays(remain)}天`;
  }

  // 預定竣工日計算 (開工日 + 契約工期 + 不計工期 - 1天)
  const totalDurationForEnd = cd + ex;
  const end = new Date(s.getTime());
  end.setDate(end.getDate() + Math.ceil(totalDurationForEnd) - 1);

  const endY = end.getFullYear() - 1911;
  const endM = String(end.getMonth() + 1).padStart(2, '0');
  const endD = String(end.getDate()).padStart(2, '0');
  const expectedEnd = `${endY}/${endM}/${endD}`;

  return {
    accum: formatDays(accum),
    remain: formatDays(remain),
    effContract: formatDays(effContract),
    rawDiff: rawDiff > 0 ? rawDiff : 0,
    expectedEnd: expectedEnd,
    accumFormula: accumFormula,
    remainFormula: remainFormula
  };
}

function App() {
  const [projects, setProjects] = useState(DEFAULT_PROJECTS);
  const [records, setRecords] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [tab, setTab] = useState("form"); // "form" | "history" | "config"
  const [rawText, setRawText] = useState("");
  const [parsed, setParsed] = useState(null);

  // 表單核心狀態
  const [projectName, setProjectName] = useState("");
  const [rocY, setRocY] = useState("");
  const [rocM, setRocM] = useState("");
  const [rocD, setRocD] = useState("");
  const [weatherAm, setWeatherAm] = useState("晴");
  const [weatherPm, setWeatherPm] = useState("晴");
  const [startY, setStartY] = useState("");
  const [startM, setStartM] = useState("");
  const [startD, setStartD] = useState("");
  const [contractDays, setContractDays] = useState("");
  const [vendorAccum, setVendorAccum] = useState("");
  const [vendorRemain, setVendorRemain] = useState("");
  const [excludeDays, setExcludeDays] = useState("");
  const [durationMode, setDurationMode] = useState("fixed");
  const [plannedPct, setPlannedPct] = useState("");
  const [actualPct, setActualPct] = useState("");
  const [workItems, setWorkItems] = useState("");

  // 新增/選填欄位
  const [sampling, setSampling] = useState("");
  const [samplingFound, setSamplingFound] = useState(false);
  const [important, setImportant] = useState("");
  const [importantFound, setImportantFound] = useState(false);

  // UI 輔助狀態
  const [copied, setCopied] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedHistoryProj, setSelectedHistoryProj] = useState("all");
  const [historyOrder, setHistoryOrder] = useState("desc");

  // 初始化與本地儲存載入
  useEffect(() => {
    try {
      const p = JSON.parse(localStorage.getItem(STORAGE_PROJECTS));
      if (Array.isArray(p) && p.length) setProjects(p);
    } catch (e) {}
    try {
      const r = JSON.parse(localStorage.getItem(STORAGE_RECORDS));
      if (Array.isArray(r)) setRecords(r);
    } catch (e) {}
  }, []);

  const saveProjects = (next) => {
    setProjects(next);
    try {
      localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(next));
    } catch (e) {}
  };

  const saveRecords = (next) => {
    setRecords(next);
    try {
      localStorage.setItem(STORAGE_RECORDS, JSON.stringify(next));
    } catch (e) {}
  };

  // 徹底清空所有輸入狀態
  const handleClearAllFields = () => {
    setRawText("");
    setParsed(null);
    setProjectName("");
    setRocY("");
    setRocM("");
    setRocD("");
    setWeatherAm("晴");
    setWeatherPm("晴");
    setStartY("");
    setStartM("");
    setStartD("");
    setContractDays("");
    setVendorAccum("");
    setVendorRemain("");
    setExcludeDays("");
    setPlannedPct("");
    setActualPct("");
    setWorkItems("");
    setSampling("");
    setSamplingFound(false);
    setImportant("");
    setImportantFound(false);
  };

  // 將解析出來的資料，套用到表單 state
  const applyParsedResults = (r) => {
    setParsed(r);
    if (r.matched.projectName) {
      const hit = projects.find(p =>
        p.includes(r.projectName) ||
        r.projectName.includes(p.replace(/^\d+\./, ""))
      );
      setProjectName(hit || r.projectName);
    } else {
      setProjectName("");
    }

    if (r.matched.date) {
      setRocY(r.rocY);
      setRocM(parseInt(r.rocM).toString());
      setRocD(parseInt(r.rocD).toString());
    } else {
      setRocY(""); setRocM(""); setRocD("");
    }

    setWeatherAm(r.weatherAm && WEATHER_OPTIONS.includes(r.weatherAm) ? r.weatherAm : "晴");
    setWeatherPm(r.weatherPm && WEATHER_OPTIONS.includes(r.weatherPm) ? r.weatherPm : "晴");

    if (r.matched.start) {
      setStartY(r.startY);
      setStartM(parseInt(r.startM).toString());
      setStartD(parseInt(r.startD).toString());
    } else {
      setStartY(""); setStartM(""); setStartD("");
    }

    setContractDays(r.contractDays || "");
    setVendorAccum(r.accumDays || "");
    setVendorRemain(r.remainDays || "");
    setExcludeDays(r.excludeDays || "");
    if (r.extendMode) setDurationMode("extend");
    setPlannedPct(r.plannedPct || "");
    setActualPct(r.actualPct || "");
    setWorkItems(r.workItems || "");

    if (r.sampling) {
      setSampling(r.sampling);
      setSamplingFound(true);
    } else {
      setSampling("");
      setSamplingFound(/施工取樣|取樣會驗/.test(rawText));
    }

    if (r.important) {
      setImportant(r.important);
      setImportantFound(true);
    } else {
      setImportant("");
      setImportantFound(/重要記事/.test(rawText));
    }
  };

  const doParse = () => {
    if (!rawText.trim()) {
      alert("請先貼上日報文字！");
      return;
    }
    const r = parseReport(rawText);
    applyParsedResults(r);
  };

  // 執行自算
  const auto = useMemo(() => {
    return computeDays(startY, startM, startD, rocY, rocM, rocD, contractDays, excludeDays, durationMode);
  }, [startY, startM, startD, rocY, rocM, rocD, contractDays, excludeDays, durationMode]);

  // 比對廠商值與自算值是否產生不一致
  const accumMismatch = useMemo(() => {
    return vendorAccum && auto.accum && parseFloat(vendorAccum) !== parseFloat(auto.accum);
  }, [vendorAccum, auto.accum]);

  const remainMismatch = useMemo(() => {
    return vendorRemain && auto.remain && parseFloat(vendorRemain) !== parseFloat(auto.remain);
  }, [vendorRemain, auto.remain]);

  const wd = useMemo(() => {
    if (rocY && rocM && rocD) {
      return rocWeekday(parseInt(rocY), parseInt(rocM), parseInt(rocD));
    }
    return "";
  }, [rocY, rocM, rocD]);

  // 一鍵修復：將廠商申報數值同步為系統自算數值
  const applyAutoValues = () => {
    if (auto.accum) setVendorAccum(auto.accum);
    if (auto.remain) setVendorRemain(auto.remain);
  };

  // 組合 LINE 輸出字串
  const buildOutput = () => {
    const useAccum = auto.accum || vendorAccum;
    const useRemain = auto.remain || vendorRemain;
    const useContract = contractDays ? formatDays(parseFloat(contractDays)) : "";

    const cleanName = String(projectName).replace(/^\s*\d+\.\s*/, "").trim();
    const ex = parseFloat(excludeDays || 0);

    const lines = [];
    lines.push(`一、工程名稱：${cleanName}`);
    lines.push(`二、日期：${rocY}/${rocM}/${rocD}(${wd})`);
    lines.push(`三、天氣：上午/${weatherAm}、下午/${weatherPm}`);

    if (auto.expectedEnd) {
      lines.push(`四、本案工期：開工日${startY}/${startM}/${startD} (預定竣工日${auto.expectedEnd})`);
    } else {
      lines.push(`四、本案工期：開工日${startY}/${startM}/${startD}`);
    }

    lines.push(`(1)契約工期：${useContract}日曆天`);
    lines.push(`(2)不計工期：${formatDays(ex)}日曆天`);
    lines.push(`(3)累計工期：${useAccum}日曆天`);
    lines.push(`(4)剩餘工期：${useRemain}日曆天`);
    lines.push(`五、工程進度`);
    lines.push(`(1)預定進度：${plannedPct}%`);
    lines.push(`(2)實際進度：${actualPct}%`);

    let currentIndex = 6;
    const cnNums = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

    if (!isEmptyOrNo(workItems)) {
      lines.push(`${cnNums[currentIndex - 1]}、本日工作項目`);
      lines.push(workItems.trim());
      currentIndex++;
    }

    const cleanSampling = (sampling || "").trim();
    const hasSampling = samplingFound && !isEmptyOrNo(cleanSampling);
    if (hasSampling) {
      lines.push(`${cnNums[currentIndex - 1]}、施工取樣會驗`);
      lines.push(cleanSampling);
      currentIndex++;
    }

    const cleanImportant = (important || "").trim();
    const hasImportant = importantFound && !isEmptyOrNo(cleanImportant);
    if (hasImportant) {
      lines.push(`${cnNums[currentIndex - 1]}、重要記事`);
      lines.push(cleanImportant);
      currentIndex++;
    }

    return lines.join("\n");
  };

  const output = useMemo(() => {
    return projectName || rocY ? buildOutput() : "";
  }, [projectName, rocY, rocM, rocD, wd, weatherAm, weatherPm, startY, startM, startD, contractDays, excludeDays, durationMode, vendorAccum, vendorRemain, auto, plannedPct, actualPct, workItems, sampling, samplingFound, important, importantFound]);

  // 複製文字功能
  const copyText = (txt) => {

      }).catch(() => fallbackCopy(txt));
    } else {
      fallbackCopy(txt);
    }
  };

  const fallbackCopy = (txt) => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      showCopyToast();
    } catch (e) {
      alert("複製失敗，請手動全選複製");
    }
    document.body.removeChild(ta);
  };

  const showCopyToast = () => {

      projectName,
      date: `${rocY}/${rocM}/${rocD}`,
      text: output,
      plannedPct: parseFloat(plannedPct) || 0,
      actualPct: parseFloat(actualPct) || 0,
      savedAt: new Date().toLocaleString("zh-TW")

      const matchProj = selectedHistoryProj === "all" || r.projectName === selectedHistoryProj;
      return matchSearch && matchProj;

  // 計算該工程歷史進度，繪製迷你圖表 (Sparkline SVG)
  const renderSparkline = (projName) => {
    const projRecs = records
      .filter(r => r.projectName === projName)
      .sort((a, b) => a.id - b.id);

    if (projRecs.length < 2) return null;

    const width = 120;
    const height = 30;
    const padding = 2;

    const maxVal = Math.max(...projRecs.map(r => r.actualPct), 1);
    const minVal = Math.min(...projRecs.map(r => r.actualPct), 0);
    const range = maxVal - minVal || 1;

    const points = projRecs.map((r, idx) => {
      const x = padding + (idx / (projRecs.length - 1)) * (width - padding * 2);
      const y = height - padding - ((r.actualPct - minVal) / range) * (height - padding * 2);
      return `${x},${y}`;
    }).join(" ");

    return (
      <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 p-1 px-2 rounded text-xs">
        <span className="text-slate-500">進度走勢:</span>
        <svg width={width} height={height} className="overflow-visible">
          <polyline
            fill="none"
            stroke="#0f766e"
            strokeWidth="2"
            points={points}
          />
          {projRecs.map((r, idx) => {
            const x = padding + (idx / (projRecs.length - 1)) * (width - padding * 2);
            const y = height - padding - ((r.actualPct - minVal) / range) * (height - padding * 2);
            return (
              <circle
                key={idx}
                cx={x}
                cy={y}
                r="3"
                className="fill-brand-700 hover:r-4 cursor-pointer"

              />

    );

                  </svg>
                  <span>儲存至歷史</span>
                </button>
              </div>
            </div>

                      </pre>
                    </details>

                  </div>

        </div>

                type="button"
                onClick={confirmRemove}
                className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition-colors"
              >
                認證並移除
              </button>
              <button
                type="button"
                onClick={() => setPendingRemove(null)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-4 rounded-xl text-xs transition-colors"
              >
                取消
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 彈窗：刪除歷史紀錄確認 */}
      {pendingDelete && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4">
            <h3 className="text-base font-bold text-slate-800">確定刪除此提報紀錄？</h3>
            <p className="text-xs text-slate-400 leading-normal">此操作將永久從本地儲存中移除此回報，且無法復原。</p>

            <div className="flex gap-2 pt-2">
              <button
                type="button"
                onClick={confirmDelete}
                className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors"
              >
                確定刪除
              </button>
              <button
                type="button"
                onClick={() => setPendingDelete(null)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-xl text-xs transition-colors"
              >
                取消
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// 渲染 App 組件
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- 啟動異常診斷腳本 -->
<script>
  setTimeout(function() {
    var root = document.getElementById('root');
    if (root && root.innerText.indexOf('監造日報助手載入中') !== -1) {
      var missing = [];
      if (!window.React) missing.push('React');
      if (!window.ReactDOM) missing.push('ReactDOM');
      if (!window.Babel) missing.push('Babel');
      var detail = missing.length
        ? '外部套件載入失敗（' + missing.join(', ') + '），請檢查目前網路環境或防火牆是否阻擋 CDN。'
        : (window.__APP_ERRORS__.length
            ? '程式發生錯誤：' + window.__APP_ERRORS__.join('；')
            : '畫面未能完成編譯，請確認複製程式碼時結尾是否完整（需包含最後的 &lt;/script&gt;&lt;/body&gt;&lt;/html&gt;），或檢查主機是否限制了 unsafe-eval。');
      root.innerHTML =
        '<div style="max-width:480px;margin:3rem auto;padding:1.5rem;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;color:#991b1b;line-height:1.6;">' +
        '<h3 style="margin:0 0 0.5rem 0;font-size:16px;font-weight:bold;">⚠️ 系統啟動失敗</h3>' +
        '<p style="margin:0;font-size:14px;">' + detail + '</p>' +
        '</div>';
    }
  }, 4000);
</script>
</body>
</html>
