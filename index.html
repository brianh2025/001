  const dt = new Date(parseInt(rocY) + 1911, parseInt(m) - 1, parseInt(d));
  if (isNaN(dt.getTime())) return "";
  return WEEK_CN[dt.getDay()];
}

function formatDays(num) {
  if (isNaN(num)) return "";
  return Number(num.toFixed(1)).toString();
}

  if (!text) return true;
  const clean = text.replace(/[\s\r\n、，。：:.,\-_ ]/g, "").trim();

    clean === "無" ||

    clean === "無重要記事" || 
    clean === "無施工取樣" ||

  );
};
