const { useState, useEffect, useRef, useMemo } = React;

// ===== 預設工程清單 =====
const DEFAULT_PROJECTS = [

  "12.Danas-F-06-02-05-四湖鄉三條崙海岸保護工復建工程",
  "13.二崙鄉新庄子大排(新庄子段新庄子小段869地號旁)左岸復建工程"
];

const STORAGE_PROJECTS = "rt_report_projects_v1";
const STORAGE_RECORDS = "rt_report_records_v1";
const REMOVE_PASSWORD = "0827"; // 移除預設工程密碼
const WEATHER_OPTIONS = ["晴", "多雲", "陰", "雨", "雷陣雨", "颱風"];
const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];

function rocWeekday(rocY, m, d) {
  const dt = new Date(parseInt(rocY) + 1911, parseInt(m) - 1, parseInt(d));
  if (isNaN(dt.getTime())) return "";
  return WEEK_CN[dt.getDay()];
}

// 格式化輸出天數，若為整數則不顯示小數點，否則保留一位小數
function formatDays(num) {
  if (isNaN(num)) return "";
  return Number(num.toFixed(1)).toString();
}

// 輔助檢查內容是否為空或填寫「無」
const isEmptyOrNo = (text) => {
  if (!text) return true;
  const clean = text.replace(/[\s\r\n、，。：:.,\-_ \d]/g, "").trim();
  return (
    clean === "" ||
    clean === "無" ||
    clean === "無事項" ||
    clean === "無工作" ||
    clean === "無重要記事" ||
    clean === "無施工取樣" ||
    clean === "無會驗" ||
    clean === "無取樣"
  );
};

function parseReport(text) {
  const result = {
    projectName: "",
    rocY: "",
    rocM: "",
    rocD: "",
    weekday: "",
    weatherAm: "",
    weatherPm: "",
    startY: "",
    startM: "",
    startD: "",
    contractDays: "",
    accumDays: "",
    remainDays: "",
    excludeDays: "",
    plannedPct: "",
    actualPct: "",
    workItems: "",
    sampling: "",
    important: "",
    matched: {},
    notes: []
  };
  if (!text) return result;
  const t = text.replace(/\r/g, "");
  let m;

  // 1. 工程名稱
  m = t.match(/工程名稱[：:\s]*([^\n]+)/);
  if (m) {
    result.projectName = m[1].trim();
    result.matched.projectName = true;
  }

  // 2. 報表日期（避免抓到開工日）
  m = t.match(/(?:^|\n)[^\n]*?日期[：:\s]*(\d{2,3})\s*[\/\-年]\s*(\d{1,2})\s*[\/\-月]\s*(\d{1,2})/);
  if (m) {
    result.rocY = m[1];
    result.rocM = m[2];
    result.rocD = m[3];
    result.weekday = rocWeekday(+m[1], +m[2], +m[3]);
    result.matched.date = true;
  }

  // 3. 天氣
  m = t.match(/上午\s*[\/：:\-－]\s*([\u4e00-\u9fa5]+)/);
  if (m) {
    result.weatherAm = m[1].trim();
    result.matched.weatherAm = true;
  } else {
    const mAlt = t.match(/天氣[：:\s]*上午[：:\s]*([\u4e00-\u9fa5]+)/);
    if (mAlt) {
      result.weatherAm = mAlt[1].trim();
      result.matched.weatherAm = true;
    }
  }

  m = t.match(/下午\s*[\/：:\-－]\s*([\u4e00-\u9fa5]+)/);
  if (m) {
    result.weatherPm = m[1].trim();
    result.matched.weatherPm = true;
  } else {
    const mAlt = t.match(/下午[：:\s]*([\u4e00-\u9fa5]+)/);
    if (mAlt && !t.match(/下午[：:\s]*([\u4e00-\u9fa5]+)/)?.[0].includes("日期")) {
      result.weatherPm = mAlt[1].trim();
      result.matched.weatherPm = true;
    }
  }

  // 4. 開工日期
  m = t.match(/開工日(?:期)?[：:\s]*(\d{2,3})\s*[\/\-年]\s*(\d{1,2})\s*[\/\-月]\s*(\d{1,2})/);
  if (m) {
    result.startY = m[1];
    result.startM = m[2];
    result.startD = m[3];
    result.matched.start = true;
  }

  // 5. 各種工期
  m = t.match(/契約工期[：:\s]*(\d+(\.\d+)?)/);
  if (m) {
    result.contractDays = m[1];
    result.matched.contractDays = true;
  }
  m = t.match(/累計工期[：:\s]*(-?\d+(\.\d+)?)/);
  if (m) {
    result.accumDays = m[1];
    result.matched.accumDays = true;
  }
  m = t.match(/剩餘工期[：:\s]*(-?\d+(\.\d+)?)/);
  if (m) {
    result.remainDays = m[1];
    result.matched.remainDays = true;
  }

  // 6. 不計工期
  m = t.match(/不計(?:工期|天數|日數)[^\d\n]*(\d+(\.\d+)?)/);
  if (m) {
    result.excludeDays = m[1];
    result.matched.excludeDays = true;
  } else {
    // 廠商以「核准展延 X 天」填報時，視為不計工期並採總工期延長模式
    m = t.match(/(?:核准展延|展延天數|展延工期)[^\d\n]*(\d+(\.\d+)?)/);
    if (m) {
      result.excludeDays = m[1];
      result.matched.excludeDays = true;
      result.extendMode = true;
    }
  }

  // 7. 進度
  m = t.match(/預定進度[：:\s]*([\d.]+)\s*%?/);
  if (m) {
    result.plannedPct = m[1];
    result.matched.planned = true;
  }
  m = t.match(/實際進度[：:\s]*([\d.]+)\s*%?/);
  if (m) {
    result.actualPct = m[1];
    result.matched.actual = true;
  }

  // 8. 本日工作項目
  m = t.match(/本日(?:工作|施工)項目[：:\s]*\n?([\s\S]*?)(?=\n\s*(?:七|八|施工取樣會驗|施工取樣|取樣會驗|重要記事|查驗項目|施工監造工作內容)[、，。:：\s]|$)/);
  if (m) {
    result.workItems = m[1].trim();
    result.matched.workItems = true;
  }

  // 9. 施工取樣
  m = t.match(/(?:施工取樣會驗|施工取樣|取樣會驗)[：:\s]*\n?([\s\S]*?)(?=\n\s*(?:八|九|重要記事|查驗項目)[、，。:：\s]|$)/);
  if (m) {
    result.sampling = m[1].trim();
  }

  // 10. 重要記事
  m = t.match(/重要記事[：:\s]*\n?([\s\S]*?)(?=\n\s*(?:九|十|查驗項目)[、，。:：\s]|$)/);
  if (m) {
    result.important = m[1].trim();
  }

  // 工期邏輯初檢
  // 以下兩種皆視為一致（不計天數有半天時，廠商捨去或進位成整數亦可）：
  //   累計 + 剩餘 = 契約工期            （累計已扣除不計）
  //   累計 + 剩餘 = 契約工期 + 不計工期  （剩餘已含不計）
  if (result.contractDays && result.accumDays && result.remainDays) {
    const sum = parseFloat(result.accumDays) + parseFloat(result.remainDays);
    const cd = parseFloat(result.contractDays);
    const ex = parseFloat(result.excludeDays || 0);
    const okTotals = [cd, cd + ex, cd + Math.floor(ex), cd + Math.ceil(ex)];
    if (!okTotals.some(v => Math.abs(sum - v) <= 0.01)) {
      const exNote = ex > 0 ? `，也不等於契約工期＋不計工期(${formatDays(cd + ex)}天)` : "";
      result.notes.push(`廠商填報數據檢算不一致：累計(${result.accumDays}) + 剩餘(${result.remainDays}) = ${formatDays(sum)}天，不等於契約工期(${result.contractDays}天)${exNote}。`);
    }

    // 依廠商填報自動判定計算模式（有不計工期時才需判定）
    if (ex > 0) {
      if (Math.abs(sum - cd) <= 0.01) {
        result.autoMode = "fixed";
        result.autoModeNote = `累計 + 剩餘 = ${formatDays(sum)}天 = 契約工期，判定為限期完工`;
      } else if (okTotals.slice(1).some(v => Math.abs(sum - v) <= 0.01)) {
        result.autoMode = "extend";
        result.autoModeNote = `累計 + 剩餘 = ${formatDays(sum)}天 = 契約工期＋不計工期，判定為總工期延長`;
      }
    }
  }
  return result;
}

function computeDays(startY, startM, startD, rocY, rocM, rocD, contractDays, excludeDays, mode, stopDays) {
  const emptyRes = { accum: "", remain: "", effContract: "", rawDiff: "", expectedEnd: "", accumFormula: "", remainFormula: "" };
  if (!startY || !rocY || !contractDays) return emptyRes;

  const s = new Date(parseInt(startY) + 1911, parseInt(startM) - 1, parseInt(startD));
  const c = new Date(parseInt(rocY) + 1911, parseInt(rocM) - 1, parseInt(rocD));

  if (isNaN(s.getTime()) || isNaN(c.getTime())) return emptyRes;

  const rawDiff = Math.floor((c - s) / 86400000) + 1; // 包含開工當日
  const ex = parseFloat(excludeDays || 0);
  const stop = parseFloat(stopDays || 0) || 0; // 停工天數：不計入累計工期，竣工日順延
  const stopTxt = stop > 0 ? ` − 停工 ${formatDays(stop)}` : "";
  const cd = parseFloat(contractDays);

  let accum, remain, effContract, accumFormula, remainFormula;

  if (mode === "extend") {
    // 總工期延長模式：累計天數照常照算，契約工期延長
    accum = Math.max(rawDiff - stop, 0);
    effContract = cd + ex;
    remain = effContract - accum;

    accumFormula = `${rawDiff}${stopTxt} = ${formatDays(accum)} 天`;
    remainFormula = `契約 ${formatDays(cd)} + 不計 ${formatDays(ex)} − 累計 ${formatDays(accum)} = ${formatDays(remain)} 天`;
  } else {
    // 限期完工模式：契約不變，累計扣除不計天數
    accum = Math.max(rawDiff - ex - stop, 0);
    effContract = cd;
    remain = cd - accum;

    accumFormula = `${rawDiff} − 不計 ${formatDays(ex)}${stopTxt} = ${formatDays(accum)} 天`;
    remainFormula = `契約 ${formatDays(cd)} − 累計 ${formatDays(accum)} = ${formatDays(remain)} 天`;
  }

  // 剩餘工期有小數（如 0.5 天）時一律捨去
  if (remain !== Math.floor(remain)) {
    const rawRemain = remain;
    remain = Math.floor(remain);
    remainFormula = remainFormula.replace(/= [^=]*天$/, `= ${formatDays(rawRemain)} → ${formatDays(remain)} 天（捨去）`);
  }

  // 預定竣工日計算 (開工日 + 契約工期 + 不計工期 + 停工天數 - 1天)
  const totalDurationForEnd = cd + ex + stop;
  const end = new Date(s.getTime());
  end.setDate(end.getDate() + Math.ceil(totalDurationForEnd) - 1);

  const endY = end.getFullYear() - 1911;
  const endM = String(end.getMonth() + 1).padStart(2, '0');
  const endD = String(end.getDate()).padStart(2, '0');
  const expectedEnd = `${endY}/${endM}/${endD}`;

  return {
    accum: formatDays(accum),
    remain: formatDays(remain),
    effContract: formatDays(effContract),
    rawDiff: rawDiff > 0 ? rawDiff : 0,
    expectedEnd: expectedEnd,
    accumFormula: accumFormula,
    remainFormula: remainFormula
  };
}

function CheckMark({ ok, expected }) {
  if (ok) {
    return (
      <span className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-100 text-emerald-700" title="與自算相符" aria-label="與自算相符">
        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>
      </span>
    );
  }
  return (
    <span className="inline-flex items-center gap-1 text-xs text-rose-600">
      <span className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-rose-100" aria-hidden="true">✕</span>
      {expected !== "" ? `應為 ${expected} 天` : "無法自算"}
    </span>
  );
}

  // 新增/選填欄位
  const [sampling, setSampling] = useState("");
  const [samplingFound, setSamplingFound] = useState(false);
  const [important, setImportant] = useState("");
  const [importantFound, setImportantFound] = useState(false);

  // UI 輔助狀態
  const [copied, setCopied] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedHistoryProj, setSelectedHistoryProj] = useState("all");
  const [historyOrder, setHistoryOrder] = useState("desc");

  // 初始化與本地儲存載入
  useEffect(() => {
    try {
      const p = JSON.parse(localStorage.getItem(STORAGE_PROJECTS));
      if (Array.isArray(p) && p.length) setProjects(p);
    } catch (e) {}
    try {
      const r = JSON.parse(localStorage.getItem(STORAGE_RECORDS));
      if (Array.isArray(r)) setRecords(r);
    } catch (e) {}
  }, []);

  const saveProjects = (next) => {
    setProjects(next);
    try {
      localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(next));
    } catch (e) {}
  };

  const saveRecords = (next) => {
    setRecords(next);
    try {
      localStorage.setItem(STORAGE_RECORDS, JSON.stringify(next));
    } catch (e) {}
  };

  // 徹底清空所有輸入狀態
  const handleClearAllFields = () => {
    setRawText("");
    setParsed(null);
    setProjectName("");
    setRocY("");
    setRocM("");
    setRocD("");
    setWeatherAm("");
    setWeatherPm("");
    setStartY("");
    setStartM("");
    setStartD("");
    setContractDays("");
    setVendorAccum("");
    setVendorRemain("");
    setExcludeDays("");
    setStopDays("");
    setAutoModeNote("");
    setPlannedPct("");
    setActualPct("");
    setWorkItems("");
    setSampling("");
    setSamplingFound(false);
    setImportant("");
    setImportantFound(false);
  };

  // 將解析出來的資料，套用到表單 state
  const applyParsedResults = (r) => {
    setParsed(r);
    if (r.matched.projectName) {
      const hit = projects.find(p =>
        p.includes(r.projectName) ||
        r.projectName.includes(p.replace(/^\d+\./, ""))
      );
      setProjectName(hit || r.projectName);
    } else {
      setProjectName("");
    }

    if (r.matched.date) {
      setRocY(r.rocY);
      setRocM(parseInt(r.rocM).toString());
      setRocD(parseInt(r.rocD).toString());
    } else {
      setRocY(""); setRocM(""); setRocD("");
    }

    setWeatherAm(r.weatherAm || "");
    setWeatherPm(r.weatherPm || "");

    if (r.matched.start) {
      setStartY(r.startY);
      setStartM(parseInt(r.startM).toString());
      setStartD(parseInt(r.startD).toString());
    } else {
      setStartY(""); setStartM(""); setStartD("");
    }

    setContractDays(r.contractDays || "");
    setVendorAccum(r.accumDays || "");
    setVendorRemain(r.remainDays || "");
    setExcludeDays(r.excludeDays || "");
    if (r.autoMode) {
      setDurationMode(r.autoMode);
      setAutoModeNote(r.autoModeNote);
    } else if (r.extendMode) {
      setDurationMode("extend");
      setAutoModeNote("廠商填報核准展延，判定為總工期延長");
    } else {
      setAutoModeNote("");
    }
    setPlannedPct(r.plannedPct || "");
    setActualPct(r.actualPct || "");
    setWorkItems(r.workItems || "");

    if (r.sampling) {
      setSampling(r.sampling);
      setSamplingFound(true);
    } else {
      setSampling("");
      setSamplingFound(/施工取樣|取樣會驗/.test(rawText));
    }

    if (r.important) {
      setImportant(r.important);
      setImportantFound(true);
    } else {
      setImportant("");
      setImportantFound(/重要記事/.test(rawText));
    }
  };

  const doParse = () => {
    if (!rawText.trim()) {
      alert("請先貼上廠商進度回報文字！");
      return;
    }
    const r = parseReport(rawText);
    applyParsedResults(r);
    setSavedThisReport(false);
    if (!r.matched.date || !r.weatherAm || !r.weatherPm) setInfoModal(true);
  };

  // 執行自算
  const auto = useMemo(() => {
    return computeDays(startY, startM, startD, rocY, rocM, rocD, contractDays, excludeDays, durationMode, stopDays);
  }, [startY, startM, startD, rocY, rocM, rocD, contractDays, excludeDays, durationMode, stopDays]);

  // 比對廠商值與自算值是否產生不一致
  const accumMismatch = useMemo(() => {
    return vendorAccum && auto.accum && parseFloat(vendorAccum) !== parseFloat(auto.accum);
  }, [vendorAccum, auto.accum]);

  const remainMismatch = useMemo(() => {
    return vendorRemain && auto.remain && parseFloat(vendorRemain) !== parseFloat(auto.remain);
  }, [vendorRemain, auto.remain]);

  const wd = useMemo(() => {
    if (rocY && rocM && rocD) {
      return rocWeekday(parseInt(rocY), parseInt(rocM), parseInt(rocD));
    }
    return "";
  }, [rocY, rocM, rocD]);

  // 區塊 2 檢核：全部通過才能複製回報
  const copyBlockers = useMemo(() => {
    const list = [];
    if (!projectName) list.push("尚未選擇工程名稱");
    if (!(rocY && rocM && rocD)) list.push("提報日期未填");
    if (!weatherAm || !weatherPm) list.push("天氣未填");
    if (auto.accum === "" || auto.remain === "") list.push("開工日期或契約工期不足，無法自算工期");
    else {
      if (vendorAccum === "" || accumMismatch) list.push("累計工期與自算不合");
      if (vendorRemain === "" || remainMismatch) list.push("剩餘工期與自算不合");
    }
    return list;
  }, [projectName, rocY, rocM, rocD, weatherAm, weatherPm, auto, vendorAccum, vendorRemain, accumMismatch, remainMismatch]);
  const durationOk = auto.accum !== "" && auto.remain !== "" && vendorAccum !== "" && vendorRemain !== "" && !accumMismatch && !remainMismatch;
  const canCopy = copyBlockers.length === 0;

  // 一鍵修復：將廠商申報數值同步為系統自算數值
  const applyAutoValues = () => {
    if (auto.accum) setVendorAccum(auto.accum);
    if (auto.remain) setVendorRemain(auto.remain);
  };

  // 組合 LINE 輸出字串
  const buildOutput = () => {
    const useAccum = auto.accum || vendorAccum;
    const useRemain = auto.remain || vendorRemain;
    const useContract = contractDays ? formatDays(parseFloat(contractDays)) : "";

    const cleanName = String(projectName).replace(/^\s*\d+\.\s*/, "").trim();
    const ex = parseFloat(excludeDays || 0);

    const lines = [];
    lines.push(`一、工程名稱：${cleanName}`);
    lines.push(`二、日期：${rocY}/${rocM}/${rocD}(${wd})`);
    lines.push(`三、天氣：上午/${weatherAm}、下午/${weatherPm}`);

    if (auto.expectedEnd) {
      lines.push(`四、本案工期：開工日${startY}/${startM}/${startD} (預定竣工日${auto.expectedEnd})`);
    } else {
      lines.push(`四、本案工期：開工日${startY}/${startM}/${startD}`);
    }

    lines.push(`(1)契約工期：${useContract}日曆天`);
    lines.push(`(2)不計工期：${formatDays(ex)}日曆天`);
    lines.push(`(3)累計工期：${useAccum}日曆天`);
    lines.push(`(4)剩餘工期：${useRemain}日曆天`);
    lines.push(`五、工程進度`);
    lines.push(`(1)預定進度：${plannedPct}%`);
    lines.push(`(2)實際進度：${actualPct}%`);

    let currentIndex = 6;
    const cnNums = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

    if (!isEmptyOrNo(workItems)) {
      lines.push(`${cnNums[currentIndex - 1]}、本日工作項目`);
      lines.push(workItems.trim());
      currentIndex++;
    }

    const cleanSampling = (sampling || "").trim();
    const hasSampling = samplingFound && !isEmptyOrNo(cleanSampling);
    if (hasSampling) {
      lines.push(`${cnNums[currentIndex - 1]}、施工取樣會驗`);
      lines.push(cleanSampling);
      currentIndex++;
    }

    const cleanImportant = (important || "").trim();
    const hasImportant = importantFound && !isEmptyOrNo(cleanImportant);
    if (hasImportant) {
      lines.push(`${cnNums[currentIndex - 1]}、重要記事`);
      lines.push(cleanImportant);
      currentIndex++;
    }

    return lines.join("\n");
  };

  const output = useMemo(() => {
    return projectName || rocY ? buildOutput() : "";
  }, [projectName, rocY, rocM, rocD, wd, weatherAm, weatherPm, startY, startM, startD, contractDays, excludeDays, durationMode, vendorAccum, vendorRemain, auto, plannedPct, actualPct, workItems, sampling, samplingFound, important, importantFound]);

  // 複製文字功能
  const copyText = (txt, askSave) => {
    const done = () => {
      showCopyToast();
      if (askSave && !savedThisReport) setSaveModal(true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    } else {
      fallbackCopy(txt, done);
    }
  };

  const fallbackCopy = (txt, done) => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      (done || showCopyToast)();
    } catch (e) {
      alert("複製失敗，請手動全選複製");
    }
    document.body.removeChild(ta);
  };

  const showCopyToast = () => {
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  // 保存歷史紀錄
  const handleSaveRecord = (silent) => {
    if (!output) {
      alert("目前尚無可保存的產出內容！");
      return;
    }
    const rec = {
      id: Date.now(),
      projectName,
      date: `${rocY}/${rocM}/${rocD}`,
      text: output,
      plannedPct: parseFloat(plannedPct) || 0,
      actualPct: parseFloat(actualPct) || 0,
      savedAt: new Date().toLocaleString("zh-TW")
    };
    saveRecords([rec, ...records]);
    setSavedThisReport(true);
    if (silent !== true) alert("本期提報紀錄已保存！可在「歷史紀錄」分頁查看與匯出。");
  };

  // 刪除歷史紀錄與彈窗
  const [pendingDelete, setPendingDelete] = useState(null);
  const deleteRecord = (id) => {
    setPendingDelete(id);
  };

  const confirmDelete = () => {
    saveRecords(records.filter(r => r.id !== pendingDelete));
    setPendingDelete(null);
  };

  // 管理專案清單
  const [newName, setNewName] = useState("");
  const [pendingRemove, setPendingRemove] = useState(null);
  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState(false);

  const addProject = () => {
    const name = newName.trim();
    if (!name) {
      alert("請輸入工程名稱");
      return;
    }
    if (projects.includes(name)) {
      alert("清單內已有此工程");
      return;
    }
    saveProjects([...projects, name]);
    setNewName("");
    setShowAdd(false);
    alert("已成功新增自訂工程！");
  };

  const removeProject = (name) => {
    setPendingRemove(name);
    setPwInput("");
    setPwError(false);
  };

  const confirmRemove = () => {
    if (pwInput !== REMOVE_PASSWORD) {
      setPwError(true);
      return;
    }
    saveProjects(projects.filter(p => p !== pendingRemove));
    setPendingRemove(null);
    setPwInput("");
    setPwError(false);
    alert("已移除該工程！");
  };

  // 歷史紀錄過濾與搜尋
  const filteredRecords = useMemo(() => {
    return records.filter(r => {
      const matchSearch = r.projectName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          r.text.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          r.date.includes(searchQuery);
      const matchProj = selectedHistoryProj === "all" || r.projectName === selectedHistoryProj;
      return matchSearch && matchProj;
    }).sort((a, b) => {
      return historyOrder === "desc" ? b.id - a.id : a.id - b.id;
    });
  }, [records, searchQuery, selectedHistoryProj, historyOrder]);

  // 計算該工程歷史進度，繪製迷你圖表 (Sparkline SVG)
  const renderSparkline = (projName) => {
    const projRecs = records
      .filter(r => r.projectName === projName)
      .sort((a, b) => a.id - b.id);

    if (projRecs.length < 2) return null;

    const width = 120;
    const height = 30;
    const padding = 2;

    const maxVal = Math.max(...projRecs.map(r => r.actualPct), 1);
    const minVal = Math.min(...projRecs.map(r => r.actualPct), 0);
    const range = maxVal - minVal || 1;

    const points = projRecs.map((r, idx) => {
      const x = padding + (idx / (projRecs.length - 1)) * (width - padding * 2);
      const y = height - padding - ((r.actualPct - minVal) / range) * (height - padding * 2);
      return `${x},${y}`;
    }).join(" ");

    return (
      <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 p-1 px-2 rounded text-xs">
        <span className="text-slate-500">進度走勢:</span>
        <svg width={width} height={height} className="overflow-visible">
          <polyline
            fill="none"
            stroke="#0f766e"
            strokeWidth="2"
            points={points}
          />
          {projRecs.map((r, idx) => {
            const x = padding + (idx / (projRecs.length - 1)) * (width - padding * 2);
            const y = height - padding - ((r.actualPct - minVal) / range) * (height - padding * 2);
            return (
              <circle
                key={idx}
                cx={x}
                cy={y}
                r="3"
                className="fill-brand-700 hover:r-4 cursor-pointer"
                title={`${r.date}: ${r.actualPct}%`}
              />
            );
          })}
        </svg>
      </div>
    );
  };

  // 清除全部紀錄
  const handleClearAllRecords = () => {
    if (confirm("⚠️ 確定要清空全部保存的提報紀錄嗎？此動作無法復原！")) {
      saveRecords([]);
    }
  };

  // 操作指引卡：依目前進度顯示下一步（四個步驟：貼上 → 解析 → 核對 → 複製）
  const GUIDE_STEPS = ["貼上進度回報", "自動解析", "核對工期", "複製回報"];
  const hint = useMemo(() => {
    if (tab !== "form") return null;
    if (copied) return { step: 4, tone: "done", text: "已複製完成，可以直接貼到 LINE 群組了。" };
    if (!rawText.trim()) return { step: 1, tone: "info", text: "在上方的輸入框，貼上廠商傳來的進度回報全文。" };
    if (!parsed) return { step: 2, tone: "info", text: "按下綠色按鈕「自動解析抓取資料」，系統會自動填好各欄位。" };
    if (!(rocY && rocM && rocD) || !weatherAm || !weatherPm) return { step: 3, tone: "warn", text: "回報裡找不到日期或天氣，請按「修改填報日期／天氣」補上。" };
    if (parsed.notes.length > 0 && (accumMismatch || remainMismatch)) return { step: 3, tone: "warn", text: "廠商填的累計和剩餘工期加起來對不上，請看區塊 2 的黃色提醒。" };
    if (accumMismatch || remainMismatch) return { step: 3, tone: "warn", text: "累計或剩餘工期跟系統算的不一樣，請修改，或按「一鍵修正為自算值」。" };
    if (!canCopy) return { step: 3, tone: "warn", text: "區塊 2 還有欄位沒處理好，要處理的項目列在區塊 3。" };
    return { step: 3, tone: "info", text: "工期檢核都通過了，往下按「一鍵複製 LINE 回報」。" };
  }, [tab, copied, rawText, parsed, accumMismatch, remainMismatch, rocY, rocM, rocD, weatherAm, weatherPm, canCopy]);
  const hintKey = hint ? `${hint.step}-${hint.tone}-${hint.text}` : "";
  const [hintClosed, setHintClosed] = useState("");

  // 預設位置：寬螢幕放在內容欄右側留白的底部（完全不遮內容）；窄螢幕貼齊畫面底部
  const [vw, setVw] = useState(window.innerWidth);
  useEffect(() => {
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const GUIDE_W = 340;
  const CONTENT_W = 672;
  const gutter = (vw - CONTENT_W) / 2;
  const guideInGutter = gutter >= GUIDE_W + 36;
  const guideDefaultStyle = guideInGutter
    ? { left: (vw + CONTENT_W) / 2 + 20, bottom: 24, width: GUIDE_W }
    : { left: 12, right: 12, bottom: "calc(12px + env(safe-area-inset-bottom))" };

  // 拖曳（位置相對視窗，捲動頁面時留在原處）
  const [bubblePos, setBubblePos] = useState(null);
  const dragRef = useRef(null);
  const bubbleRef = useRef(null);
  const onBubbleDown = (e) => {
    if (e.target.closest("button")) return;
    const r = bubbleRef.current.getBoundingClientRect();
    dragRef.current = { dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onBubbleMove = (e) => {
    const d = dragRef.current;
    if (!d) return;
    const x = Math.min(Math.max(e.clientX - d.dx, 8), window.innerWidth - d.w - 8);
    const y = Math.min(Math.max(e.clientY - d.dy, 8), window.innerHeight - d.h - 8);
    setBubblePos({ x, y, w: d.w });
  };
  const onBubbleUp = () => { dragRef.current = null; };
  const showGuide = hint && hintClosed !== hintKey;

  // 生成下拉選項數值
  const yearOpts = Array.from({ length: 11 }, (_, i) => 114 + i);
  const monthOpts = Array.from({ length: 12 }, (_, i) => i + 1);
  const dayOpts = Array.from({ length: 31 }, (_, i) => i + 1);

  return (
    <div className="max-w-2xl mx-auto px-4 py-3 md:py-5">

      {/* 標頭頂部欄 */}
      <header className="mb-3">
        <div className="flex items-center justify-center gap-2.5">
          <span className="inline-flex items-center justify-center bg-brand-50 text-brand-700 w-9 h-9 rounded-xl border border-brand-100 shrink-0">
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
          </span>
          <h1 className="text-xl md:text-2xl font-medium text-slate-900 tracking-tight m-0">監造每週提報助手</h1>
        </div>
        {showWelcome && (
          <p className={`welcome text-sm text-slate-600 text-center mt-2 mb-0 ${welcomeFading ? "is-fading" : ""}`}>
            {greeting}！貼上廠商的進度回報，我會幫你檢算工期、整理成 LINE 回報。
          </p>
        )}
      </header>

      {/* 分頁 Tab */}
      <div className="flex p-1 bg-slate-200/70 rounded-xl mb-3 gap-1">
        <button
          className={`flex-1 flex items-center justify-center gap-2 py-1.5 rounded-lg text-sm font-medium transition-all ${
            tab === "form" ? "bg-white text-brand-800 shadow-sm" : "text-slate-600 hover:text-slate-800 hover:bg-white/40"
          }`}
          onClick={() => setTab("form")}
        >
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          解析與申報
        </button>
        <button
          className={`flex-1 flex items-center justify-center gap-2 py-1.5 rounded-lg text-sm font-medium transition-all ${
            tab === "history" ? "bg-white text-brand-800 shadow-sm" : "text-slate-600 hover:text-slate-800 hover:bg-white/40"
          }`}
          onClick={() => setTab("history")}
        >
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          歷史紀錄 ({records.length})
        </button>
        <button
          className={`flex-1 flex items-center justify-center gap-2 py-1.5 rounded-lg text-sm font-medium transition-all ${
            tab === "config" ? "bg-white text-brand-800 shadow-sm" : "text-slate-600 hover:text-slate-800 hover:bg-white/40"
          }`}
          onClick={() => setTab("config")}
        >
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                  <option value="all">全部工程 ({records.length})</option>
                  {[...new Set(records.map(r => r.projectName))].map(name => (
                    <option key={name} value={name}>{name.replace(/^\d+\./, "")}</option>
                  ))}
                </select>

                <select
                  className="border border-slate-200 rounded-xl px-3 py-2 text-xs bg-slate-50 text-slate-700"
                  value={historyOrder}
                  onChange={(e) => setHistoryOrder(e.target.value)}
                >
                  <option value="desc">最新 ➜ 最舊</option>
                  <option value="asc">最舊 ➜ 最新</option>
                </select>
              </div>
            </div>

            {/* 工程進度走勢 */}
            {selectedHistoryProj !== "all" && renderSparkline(selectedHistoryProj)}

            {/* 紀錄列表 */}
            {filteredRecords.length === 0 ? (
              <div className="text-center py-12 text-slate-400">
                <svg className="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0V9a2 2 0 00-2-2H6a2 2 0 00-2 2v4.586a1 1 0 01-.293.707l-2.828 2.828a1 1 0 01-1.414 0l-2.828-2.828A1 1 0 012 13.586V13" />
                </svg>
                <p className="text-sm font-medium">沒有符合條件的保存紀錄</p>
              </div>
            ) : (
              <div className="space-y-4 max-h-[600px] overflow-y-auto pr-1">
                {filteredRecords.map(r => (
                  <div key={r.id} className="border border-slate-200/80 rounded-xl p-4 bg-slate-50/50 hover:bg-slate-50 transition-colors space-y-3">

                    <div className="flex justify-between items-start gap-4">
                      <div className="space-y-1">
                        <span className="bg-brand-100 text-brand-800 text-[10px] font-medium px-2 py-0.5 rounded">
                          {r.date}
                        </span>
                        <h4 className="text-sm font-medium text-slate-800 leading-snug">
                          {r.projectName}
                        </h4>
                        <p className="text-[10px] text-slate-400">儲存時間: {r.savedAt}</p>
                      </div>

                      <div className="flex gap-2 shrink-0">
                        <button
                          type="button"
                          onClick={() => { copyText(r.text); }}
                          className="bg-brand-50 hover:bg-brand-100 text-brand-800 border border-brand-200 text-xs font-medium px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1"
                        >
                          複製
                        </button>
                        <button
                          type="button"
                          onClick={() => deleteRecord(r.id)}
                          className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-medium px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1"
                        >
                          刪除
                        </button>
                      </div>
                    </div>

                    {r.plannedPct > 0 || r.actualPct > 0 ? (
                      <div className="flex gap-3 text-xs text-slate-500 bg-white border border-slate-100 p-1.5 px-2.5 rounded-lg w-max font-mono font-medium">
                        <span>預定: {r.plannedPct}%</span>
                        <span className="text-slate-300">|</span>
                        <span>實際: {r.actualPct}%</span>
                      </div>
                    ) : null}

                    <details className="group">
                      <summary className="text-xs text-brand-700 hover:text-brand-900 font-medium cursor-pointer list-none flex items-center gap-1">
                        <svg className="w-3.5 h-3.5 transform group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7" />
                        </svg>
                        展開詳細回報文字
                      </summary>
                      <pre className="mt-2 bg-white border border-slate-200 p-3 rounded-lg text-xs font-mono text-slate-600 leading-relaxed whitespace-pre-wrap max-h-52 overflow-y-auto">
                        {r.text}
                      </pre>
                    </details>

                  </div>
                ))}
              </div>
            )}

          </div>
        </div>
      )}

      {/* 3. 工程清單配置分頁 */}
      {tab === "config" && (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm space-y-4">

            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <span className="text-slate-800 font-medium text-[15px]">工程資料庫管理</span>
              <button
                type="button"
                onClick={() => setShowAdd(true)}
                className="bg-brand-700 hover:bg-brand-800 text-white font-medium text-xs py-2 px-3.5 rounded-lg transition-all shadow-sm flex items-center gap-1"
              >
                <span>＋ 新增自訂工程</span>
              </button>
            </div>

            <p className="text-xs text-slate-400 leading-normal">
              這裡列出了目前抓取匹配的工程清單，系統解析時會自動模糊匹配這裡的工程全名。您新增的自訂項目會保存於本瀏覽器，如欲刪除預設項目需輸入管理密碼。
            </p>

            <div className="border border-slate-200 rounded-xl overflow-hidden">
              <div className="divide-y divide-slate-100 max-h-[450px] overflow-y-auto">
                {projects.map((p, idx) => {
                  const isDefault = DEFAULT_PROJECTS.includes(p);
                  return (
                    <div key={idx} className="flex items-center justify-between p-3 px-4 hover:bg-slate-50 transition-colors">
                      <div className="space-y-0.5">
                        <span className="text-sm font-medium text-slate-700 block leading-snug">
                          {p}
                        </span>
                        <span className={`inline-block text-[9px] font-medium px-1.5 py-0.5 rounded ${
                          isDefault ? "bg-slate-100 text-slate-500" : "bg-emerald-50 text-emerald-700"
                        }`}>
                          {isDefault ? "系統預設" : "使用者自訂"}
                        </span>
                      </div>
                      <button
                        type="button"
                        onClick={() => removeProject(p)}
                        className="text-slate-400 hover:text-rose-600 p-1.5 rounded transition-colors"
                        title="移除工程"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

          </div>
        </div>
      )}

      {/* 彈窗：新增工程 */}
      {showAdd && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 max-w-md w-full shadow-xl space-y-4">
            <div className="flex justify-between items-start">
              <h3 className="text-base font-medium text-slate-800">新增工程到資料庫</h3>
              <button onClick={() => setShowAdd(false)} className="text-slate-400 hover:text-slate-600">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <div className="space-y-3">
              <p className="text-xs text-slate-400">請輸入工程之全銜。建議保持與合約書相同之編號與名稱，便於系統日後進行高精準度解析匹配。</p>

              <input
                type="text"
                className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-brand-500/20"
                value={newName}
                onChange={(e) => setNewName(e.target.value)}
                placeholder="例：14.麥寮鄉後安寮小段改善工程"
              />
            </div>

            <div className="flex gap-2 pt-2">
              <button
                type="button"
                onClick={addProject}
                className="flex-1 bg-brand-700 hover:bg-brand-800 text-white font-medium py-2 px-4 rounded-xl text-xs transition-colors"
              >
                確認新增
              </button>
              <button
                type="button"
                onClick={() => setShowAdd(false)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 px-4 rounded-xl text-xs transition-colors"
              >
                取消
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 彈窗：移除確認 (安全密碼) */}
      {pendingRemove && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4">
            <h3 className="text-base font-medium text-slate-800">確認移除工程項目</h3>

            <div className="bg-rose-50 border border-rose-100 text-rose-800 p-3 rounded-lg text-xs leading-normal">
              即將移出：<span>{pendingRemove}</span>
            </div>

            <div className="space-y-1.5">
              <span className="text-xs text-slate-400 block font-medium">請輸入管理密碼以確認移除</span>
              <input
                type="password"
                className={`w-full border rounded-xl p-2.5 text-sm text-center ${
                  pwError ? "border-rose-400 bg-rose-50 focus:ring-rose-500/20" : "border-slate-200 focus:ring-brand-500/20"
                }`}
                value={pwInput}
                onChange={(e) => {
                  setPwInput(e.target.value);
                  setPwError(false);
                }}
                placeholder="安全管理碼"
                inputMode="numeric"
              />
              {pwError && <span className="text-[10px] text-rose-600 block font-medium">❌ 安全認證密碼不正確！</span>}
            </div>

            <div className="flex gap-2">
              <button
                type="button"
                onClick={confirmRemove}
                className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 px-4 rounded-xl text-xs transition-colors"
              >
                認證並移除
              </button>
              <button
                type="button"
                onClick={() => setPendingRemove(null)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 px-4 rounded-xl text-xs transition-colors"
              >
                取消
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 彈窗：刪除歷史紀錄確認 */}
      {pendingDelete && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4">
            <h3 className="text-base font-medium text-slate-800">確定刪除此提報紀錄？</h3>
            <p className="text-xs text-slate-400 leading-normal">此操作將永久從本地儲存中移除此回報，且無法復原。</p>

            <div className="flex gap-2 pt-2">
              <button
                type="button"
                onClick={confirmDelete}
                className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-medium py-2.5 px-4 rounded-xl text-xs transition-colors"
              >
                確定刪除
              </button>
              <button
                type="button"
                onClick={() => setPendingDelete(null)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2.5 px-4 rounded-xl text-xs transition-colors"
              >
                取消
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 彈窗：補充日期與天氣 */}
      {infoModal && (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4 text-sm text-slate-700">
            <div className="space-y-1">
              <h3 className="text-base font-medium text-slate-800 m-0">請補充提報日期與天氣</h3>
              <p className="text-xs text-slate-500 m-0">進度回報中未解析到以下資料，補齊後才能複製回報。</p>
            </div>
            <div className="space-y-1">
              <span className="text-xs text-slate-500 block">提報日期 (民國)</span>
              <div className="flex flex-wrap items-center gap-1.5">
                <select className={`border rounded-lg px-1.5 py-1.5 ${rocY ? "border-slate-200" : "border-rose-300"}`} value={rocY} onChange={(e) => setRocY(e.target.value)}>
                  <option value="">年</option>
                  {yearOpts.map(y => <option key={y} value={y}>{y} 年</option>)}
                </select>
                <select className={`border rounded-lg px-1.5 py-1.5 ${rocM ? "border-slate-200" : "border-rose-300"}`} value={rocM} onChange={(e) => setRocM(e.target.value)}>
                  <option value="">月</option>
                  {monthOpts.map(m => <option key={m} value={m}>{m} 月</option>)}
                </select>
                <select className={`border rounded-lg px-1.5 py-1.5 ${rocD ? "border-slate-200" : "border-rose-300"}`} value={rocD} onChange={(e) => setRocD(e.target.value)}>
                  <option value="">日</option>
                  {dayOpts.map(d => <option key={d} value={d}>{d} 日</option>)}
                </select>
                {wd && <span className="text-brand-700">週{wd}</span>}
              </div>
            </div>
            <div className="space-y-1">
              <span className="text-xs text-slate-500 block">天氣</span>
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs text-slate-500">上午</span>
                <select className={`border rounded-lg px-1.5 py-1.5 ${weatherAm ? "border-slate-200" : "border-rose-300"}`} value={weatherAm} onChange={(e) => setWeatherAm(e.target.value)}>
                  <option value="">請選擇</option>
                  {[...new Set([...WEATHER_OPTIONS, weatherAm].filter(Boolean))].map(w => <option key={w} value={w}>{w}</option>)}
                </select>
                <span className="text-xs text-slate-500 ml-1">下午</span>
                <select className={`border rounded-lg px-1.5 py-1.5 ${weatherPm ? "border-slate-200" : "border-rose-300"}`} value={weatherPm} onChange={(e) => setWeatherPm(e.target.value)}>
                  <option value="">請選擇</option>
                  {[...new Set([...WEATHER_OPTIONS, weatherPm].filter(Boolean))].map(w => <option key={w} value={w}>{w}</option>)}
                </select>
              </div>
            </div>
            <div className="flex gap-2 pt-1">
              <button
                type="button"
                disabled={!(rocY && rocM && rocD && weatherAm && weatherPm)}
                onClick={() => setInfoModal(false)}
                className="flex-1 bg-brand-700 hover:bg-brand-800 disabled:bg-slate-300 disabled:cursor-not-allowed text-white py-2 px-4 rounded-xl text-sm transition-colors"
              >
                確認
              </button>
              <button
                type="button"
                onClick={() => setInfoModal(false)}
                className="bg-slate-100 hover:bg-slate-200 text-slate-600 py-2 px-4 rounded-xl text-sm transition-colors"
              >
                稍後再補
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 彈窗：複製後提醒儲存 */}
      {saveModal && (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl space-y-4 text-sm text-slate-700">
            <div className="space-y-1">
              <h3 className="text-base font-medium text-slate-800 m-0">已複製回報，要存到歷史紀錄嗎？</h3>
              <p className="text-xs text-slate-500 m-0">存檔後可在「歷史紀錄」查看此工程的進度走勢。</p>
            </div>
            <div className="flex gap-2">
              <button
                type="button"
                onClick={() => { handleSaveRecord(true); setSaveModal(false); }}
                className="flex-1 bg-brand-700 hover:bg-brand-800 text-white py-2 px-4 rounded-xl text-sm transition-colors"
              >
                儲存
              </button>
              <button
                type="button"
                onClick={() => setSaveModal(false)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2 px-4 rounded-xl text-sm transition-colors"
              >
                不用
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 回到頂端 */}
      <div className="pt-6 pb-16 text-center">
        <button
          type="button"
          onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
          className="bg-white hover:bg-slate-50 text-brand-800 border border-slate-200 font-medium py-2 px-5 rounded-full text-sm shadow-sm"
        >
          ↑ 回到頂端
        </button>
      </div>

      {/* 窄螢幕時指引卡貼底，預留空間讓最後的內容可捲到卡片上方 */}
      {showGuide && !guideInGutter && !bubblePos && <div className="h-32" aria-hidden="true"></div>}

      {/* 操作指引卡（可拖曳） */}
      {showGuide && (
        <div
          ref={bubbleRef}
          onPointerDown={onBubbleDown}
          onPointerMove={onBubbleMove}
          onPointerUp={onBubbleUp}
          onPointerCancel={onBubbleUp}
          style={bubblePos ? { left: bubblePos.x, top: bubblePos.y, width: bubblePos.w } : guideDefaultStyle}
          className={`guide guide-${hint.tone} fixed z-40 cursor-grab active:cursor-grabbing select-none touch-none`}
          role="status"
          aria-live="polite"
        >
          <div className="flex items-center gap-2">
            <span className="guide-step">{hint.tone === "done" ? "全部完成" : `第 ${hint.step} 步（共 4 步）`}</span>
            <span className="guide-label">{GUIDE_STEPS[hint.step - 1]}</span>
            <button
              type="button"
              onClick={() => setHintClosed(hintKey)}
              className="guide-close ml-auto"
              aria-label="關閉指引"
            >
              ✕
            </button>
          </div>
          <div className="guide-rail" aria-hidden="true">
            {GUIDE_STEPS.map((_, i) => (
              <span key={i} className={i < hint.step - 1 || hint.tone === "done" ? "is-done" : i === hint.step - 1 ? "is-now" : ""}></span>
            ))}
          </div>
          <p key={hintKey} className="guide-text">{hint.text}</p>
        </div>
      )}

    </div>
  );
}

// 渲染 App 組件
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- 啟動異常診斷腳本 -->
<script>
  setTimeout(function() {
    var root = document.getElementById('root');
    if (root && root.innerText.indexOf('監造每週提報助手載入中') !== -1) {
      var missing = [];
      if (!window.React) missing.push('React');
      if (!window.ReactDOM) missing.push('ReactDOM');
      if (!window.Babel) missing.push('Babel');
      var detail = missing.length
        ? '外部套件載入失敗（' + missing.join(', ') + '），請檢查目前網路環境或防火牆是否阻擋 CDN。'
        : (window.__APP_ERRORS__.length
            ? '程式發生錯誤：' + window.__APP_ERRORS__.join('；')
            : '畫面未能完成編譯，請確認複製程式碼時結尾是否完整（需包含最後的 &lt;/script&gt;&lt;/body&gt;&lt;/html&gt;），或檢查主機是否限制了 unsafe-eval。');
      root.innerHTML =
        '<div style="max-width:480px;margin:3rem auto;padding:1.5rem;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;color:#991b1b;line-height:1.6;">' +
        '<h3 style="margin:0 0 0.5rem 0;font-size:16px;font-weight:bold;">⚠️ 系統啟動失敗</h3>' +
        '<p style="margin:0;font-size:14px;">' + detail + '</p>' +
        '</div>';
    }
  }, 4000);
</script>
</body>
</html>
